name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Verify database migrations from an empty SQLite database
        working-directory: backend
        env:
          PRICEWATCH_DATABASE_URL: sqlite:///./migration-check.db
        run: python -m alembic upgrade head

      - name: Compile Python source and tests
        run: python -m compileall -q backend/app backend/tests

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/src/app.js
          node --check frontend/src/api.js
          node --check frontend/src/actions.js
          node --check frontend/tests/api.test.js

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
